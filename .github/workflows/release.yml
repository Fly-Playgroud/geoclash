name: Release

# 推送 v* tag 时：测试 → 交叉编译 6 个平台并打包 → 创建 GitHub Release 并上传压缩包与 SHA256SUMS。
# 如果该 tag 的 Release 已经存在（例如手动创建过），只上传 / 覆盖附件，不改动发布说明。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 需要完整的 tag 信息

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build and package
        run: bash scripts/build.sh "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(dist/geoclash_*.tar.gz dist/geoclash_*.zip dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "geoclash $TAG" --generate-notes --verify-tag
          fi
